[project]
name = "agentrank-api"
version = "0.0.0"
description = "AgentRank FastAPI backend"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    # The Razorpay REST adapter. Already present for the FastAPI test client, promoted to a
    # runtime dependency rather than added: the alternative was Razorpay's own SDK, which is a
    # synchronous requests client and cannot be called from this application's event loop
    # without a thread pool. See agentrank_api/razorpay/client.py.
    "httpx2>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrank_api"]
