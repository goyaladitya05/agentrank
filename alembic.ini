# The database URL is not configured here. migrations/env.py reads it from application
# settings so that migrations and the application can never disagree about the target,
# and so that no credential is written to a tracked file.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
