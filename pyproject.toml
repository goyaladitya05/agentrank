[project]
name = "agentrank"
version = "0.0.0"
description = "AI commerce readiness benchmark and Merchant Compiler"
requires-python = "==3.14.*"
dependencies = ["agentrank-api"]

[tool.uv]
package = false

[tool.uv.sources]
agentrank-api = { workspace = true }

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
# apps/web is the Next.js console. It sits under apps/ but is not a Python package, and
# uv treats every glob match as a workspace member unless it is excluded.
exclude = ["apps/web"]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "N",      # pep8 naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "ASYNC",  # async correctness
    "S",      # bandit security rules
    "RUF",    # ruff specific
]
ignore = [
    "S101",  # assert is expected in tests and is checked per file below
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hardcoded test credentials are intentional

[tool.ruff.lint.isort]
known-first-party = ["agentrank_api"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_configs = true
exclude = ["\\.venv", "node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Warnings are failures so that deprecations are dealt with when they appear rather
# than accumulating until an upgrade forces the issue.
filterwarnings = ["error"]
