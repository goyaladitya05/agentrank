name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI is independent verification, not the debugging loop. Superseded runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: agentrank
          POSTGRES_USER: agentrank
          # CI only, throwaway, and not a secret. It never leaves the runner.
          POSTGRES_PASSWORD: agentrank_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentrank -d agentrank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      AGENTRANK_ENV: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: agentrank
      POSTGRES_USER: agentrank
      POSTGRES_PASSWORD: agentrank_ci_password

    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact release. setup-uv does not publish a floating major tag.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The operator backup procedure is `pg_dump` and `pg_restore`, and a client refuses a
      # server newer than itself. Without a version 18 client on the runner, the tests that
      # execute that procedure skip themselves and the release gate proves nothing about the one
      # thing standing between a disk failure and every merchant's evidence.
      - name: Install the PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy apps/api migrations tests scripts

      # Migrations must apply, reverse and reapply against a real PostgreSQL 18.
      - name: Migrations
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Tests
        run: uv run pytest

      - name: Text style
        run: uv run python scripts/check-text-style.py

      - name: Whitespace
        run: ./scripts/check-whitespace.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from packageManager in the root package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @agentrank/web lint

      - name: Formatting
        run: pnpm --filter @agentrank/web format:check

      - name: Type check
        run: pnpm --filter @agentrank/web typecheck

      - name: Tests
        run: pnpm --filter @agentrank/web test

      - name: Production build
        run: pnpm --filter @agentrank/web build

  browser:
    name: Browser workflow
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: agentrank
          POSTGRES_USER: agentrank
          # CI only, throwaway, and not a secret. It never leaves the runner.
          POSTGRES_PASSWORD: agentrank_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentrank -d agentrank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      AGENTRANK_ENV: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: agentrank
      POSTGRES_USER: agentrank
      POSTGRES_PASSWORD: agentrank_ci_password

    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact release. setup-uv does not publish a floating major tag.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # The pnpm version comes from packageManager in the root package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile

      # Only the one browser the workflow drives, with the system libraries it needs.
      - name: Install Chromium
        run: pnpm --filter @agentrank/web exec playwright install --with-deps chromium

      # The critical merchant review workflow against a real API, a real console build and a
      # real PostgreSQL. It seeds its own merchant, so it depends on no fixture left behind.
      - name: Browser workflow
        run: make test-browser
