# Local development only. The credentials below are development defaults, not secrets,
# and must never be reused for anything real.
services:
  postgres:
    image: postgres:18
    container_name: agentrank-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentrank}
      POSTGRES_USER: ${POSTGRES_USER:-agentrank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentrank_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images place PGDATA at /var/lib/postgresql/18/docker, so the volume
      # is mounted one level up at /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agentrank} -d ${POSTGRES_DB:-agentrank}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    name: agentrank_postgres_data
